# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine # keep in sync with backend TestcontainersConfiguration
    environment:
      POSTGRES_DB: pourfolio
      POSTGRES_USER: pourfolio
      POSTGRES_PASSWORD: pourfolio
    ports:
      - "5432:5432"
    volumes:
      - pourfolio-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pourfolio -d pourfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pourfolio-db:
