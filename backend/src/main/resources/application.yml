server:
  # Hosting platforms (Render, Railway, Cloud Run, ...) set PORT.
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pourfolio-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pourfolio}
    username: ${DATABASE_USERNAME:pourfolio}
    password: ${DATABASE_PASSWORD:pourfolio}
    hikari:
      # Don't keep idle connections open, so a scale-to-zero database (Neon) can suspend
      # when the app isn't used. The first query after a pause opens a new connection.
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Items without a value (e.g. no ABV) sort last in both directions.
      hibernate.order_by.default_null_ordering: last
  flyway:
    locations: classpath:db/migration
  jackson:
    # Optional fields are left out instead of sent as null (matches the generated TS types).
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # /actuator/health/liveness answers without touching the database. Use it as the
        # hosting platform's health check so frequent checks don't keep the database awake.
        # /actuator/health still includes the database check for manual diagnostics.
        enabled: true

springdoc:
  # API documentation is off unless enabled (it is in application-local.yml).
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

pourfolio:
  cors:
    # Comma-separated list of origins allowed to call /api/** (e.g. the Vercel frontend URL).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    # The single user's credentials and the token signing secret. No defaults: the app
    # refuses to start without them (development values are in application-local.yml).
    username: ${AUTH_USERNAME:}
    password: ${AUTH_PASSWORD:}
    # At least 32 characters. Changing it signs out every device.
    token-secret: ${AUTH_TOKEN_SECRET:}
    token-ttl: 24h
