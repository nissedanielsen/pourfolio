# Test-only settings, merged on top of src/main/resources/application.yml.
pourfolio:
  # Tests never call the real Open Food Facts.
  open-food-facts:
    enabled: false
  auth:
    username: test-user
    password: test-password
    token-secret: test-secret-that-is-at-least-32-characters-long

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
